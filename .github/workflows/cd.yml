---
name: CD

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Image tag to build and push
                required: true
                default: latest

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        name: Build & Push Docker Image
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  fetch-depth: 0

            - name: GitVersion
              id: gitversion
              uses: chrysa/github-actions/gitversion@v1.10.0

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
              with:
                  images: ghcr.io/${{ github.repository_owner }}/container-webview-api
                  tags: |
                      type=semver,pattern={{version}},value=${{ steps.gitversion.outputs.semVer }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ steps.gitversion.outputs.semVer }}
                      type=raw,value=latest,enable=${{ github.event_name == 'release' }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push API image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
              with:
                  context: ./api
                  file: ./api/Dockerfile
                  target: prod
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      VERSION=${{ steps.gitversion.outputs.semVer }}

            - name: Summary
              run: |
                  echo "## CD Summary" >> "$GITHUB_STEP_SUMMARY"
                  echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/container-webview-api:${{ steps.gitversion.outputs.semVer }}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "### Tags published" >> "$GITHUB_STEP_SUMMARY"
                  echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
                  echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
