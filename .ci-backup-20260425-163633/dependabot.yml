updates:
- directory: /api
  groups:
    python-deps:
      patterns:
      - '*'
  labels:
  - dependencies
  - backend
  open-pull-requests-limit: 10
  package-ecosystem: pip
  schedule:
    day: monday
    interval: weekly
- directory: /code
  groups:
    npm-deps:
      patterns:
      - '*'
  labels:
  - dependencies
  - frontend
  open-pull-requests-limit: 10
  package-ecosystem: npm
  schedule:
    day: monday
    interval: weekly
- directory: /
  labels:
  - dependencies
  - ci/cd
  open-pull-requests-limit: 10
  package-ecosystem: github-actions
  schedule:
    day: monday
    interval: weekly
- directory: /
  labels:
  - dependencies
  - pre-commit
  open-pull-requests-limit: 10
  package-ecosystem: pre-commit
  schedule:
    day: monday
    interval: weekly
version: 2
