.local:
  after: true
  all: false
  before: true
  display: true
  dump: true
  engine: docker,auto
  list: true
  manual: true
  network: host
  notify: true
  pipeline: false
  pull: true
  real_paths: true
  rmi: true
  sockets: true
before_script:
- npm install
build:
  artifacts:
    paths:
    - dist
  script:
  - npm run build
  stage: build
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
  - node_modules/
image: node:lts-alpine
publish_gitlab_registry:
  dependencies:
  - build
  needs:
  - artifacts: true
    job: build
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - npm config set ${ORANIZATION}:registry https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
  - npm config set -- '//gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken'
    "${CI_JOB_TOKEN}"
  - npm config set -- '//gitlab.com/api/v4/packages/npm/:_authToken' "${CI_JOB_TOKEN}"
  - npm publish
  stage: deploy
publish_npm:
  dependencies:
  - build
  needs:
  - artifacts: true
    job: build
  rules:
  - if: $CI_COMMIT_TAG
  script:
  - npm config set -- '//registry.npmjs.org/:_authToken' "${NPM_TOKEN}"
  - npm publish --access public
  stage: deploy
stages:
- test
- build
- deploy
test:
  script:
  - npm run test
  stage: test
