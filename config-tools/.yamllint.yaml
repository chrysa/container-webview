---
extends: default

# GitHub Actions workflows are validated by GitHub/actionlint, not yamllint:
# they use GitHub-lenient run-block indentation and `on:` truthy keys that a
# strict YAML linter rejects. Per shared-standards, .github/workflows is exempt
# from generic YAML processing.
ignore: |
  .github/workflows/

rules:
  document-start: disable
  colons:
    max-spaces-before: 0
    max-spaces-after: 1
  commas:
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1
  indentation:
    level: warning
    indent-sequences: consistent
  line-length:
    max: 200
